name: Compilation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Logiciel PC (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler Keystone.exe
        run: >
          dotnet publish pc/PCMonitor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Keystone-exe
          path: out/Keystone.exe
          if-no-files-found: error

  android:
    name: Appli Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler Keystone.apk
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Keystone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Keystone-apk
          path: Keystone.apk
          if-no-files-found: error

  release:
    name: Publier la dernière version
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Remplacer la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub renvoie parfois une erreur 502 passagère : on réessaie
          for i in 1 2 3 4; do
            gh release delete latest --yes --cleanup-tag -R "$REPO" || true
            if gh release create latest dist/Keystone.exe dist/Keystone.apk -R "$REPO" \
              --target "${{ github.sha }}" \
              --title "Keystone (compilation ${{ github.run_number }})" \
              --notes "Keystone.exe : logiciel pour le PC Windows. Keystone.apk : appli pour le téléphone Android. Voir le README pour l'installation."; then
              exit 0
            fi
            sleep 20
          done
          exit 1
